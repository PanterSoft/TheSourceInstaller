[package]
name = "tsi"
version = "0.2.2"
edition = "2021"
description = "The Source Installer - A cross-platform source-based package manager"
license = "MIT"
repository = "https://github.com/PanterSoft/tsi"

[lib]
name = "tsi"
path = "src/lib.rs"

[[bin]]
name = "tsi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", default-features = false, features = ["tls"] }
tar = "0.4"
flate2 = "1.0"
# "static" forces lzma-sys/bzip2-sys to compile the bundled C sources and
# link them statically, instead of possibly picking up a system liblzma/libbz2
# via pkg-config. This is required for fully static musl release binaries
# (see .github/workflows/release.yml) and is a no-op-safe superset of dynamic
# linking on macOS/Windows (just always builds the vendored C sources).
xz2 = { version = "0.1", features = ["static"] }
bzip2 = { version = "0.4", features = ["static"] }
zip = "0.6"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.4"
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
toml = "0.8"
fs4 = "0.6"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }

[dev-dependencies]
tempfile = "3.10"

# GitLab CI: mirrors the Rust CI steps from .github/workflows/rust-ci.yml.
# Primary CI is GitHub Actions; this file is for GitLab-based mirrors and forks.

stages:
  - test
  - lint

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

test:rust:
  stage: test
  image: rust:latest
  script:
    - cargo build --release
    - cargo test
  tags:
    - docker

lint:rust:
  stage: lint
  image: rust:latest
  script:
    - cargo clippy -- -D warnings
    - cargo fmt --check
  tags:
    - docker

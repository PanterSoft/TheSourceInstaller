name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux legs build fully static musl binaries so they run unmodified
          # on Alpine/musl and on older-glibc distros (no glibc version skew).
          - runner: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            cross: false
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-musl
            cross: false
          # No native armv7 runner, so this leg is cross-compiled via
          # houseabsolute/actions-rust-cross (cross-rs backend). Build only:
          # the resulting binary can't be executed on the x86_64/aarch64 host.
          - runner: ubuntu-latest
            platform: linux-armv7
            target: armv7-unknown-linux-musleabihf
            cross: true
          - runner: macos-latest
            platform: darwin-aarch64
            target: ""
            cross: false
          - runner: windows-latest
            platform: windows-x86_64
            target: ""
            cross: false
          - runner: windows-11-arm
            platform: windows-aarch64
            target: ""
            cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      # The cross leg installs and drives its own Rust toolchain inside the
      # cross-rs container, so it skips the steps below that assume a host
      # toolchain building directly on this runner.
      - name: Install Rust
        if: ${{ !matrix.cross }}
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: ${{ !matrix.cross && matrix.target != '' }}
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools
        if: ${{ !matrix.cross && contains(matrix.target, 'musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Cargo
        if: ${{ !matrix.cross }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release
          fi

      - name: Run tests
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo test --target ${{ matrix.target }}
          else
            cargo test
          fi

      - name: Build (cross)
        if: ${{ matrix.cross }}
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: "--release"

      # Regression guard for the "single static binary" promise: fail the
      # job if a Linux artifact isn't actually statically linked musl.
      - name: Verify static linking (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/tsi"
          echo "== file =="
          file "$BIN"

          # x86_64-musl produces static-PIE, which glibc ldd reports as
          # "statically linked" rather than "not a dynamic executable".
          # The property that matters is zero NEEDED entries.
          echo "== readelf NEEDED =="
          if readelf -d "$BIN" 2>/dev/null | grep -q NEEDED; then
            echo "ERROR: $BIN has dynamic library dependencies:" >&2
            readelf -d "$BIN" | grep NEEDED >&2
            exit 1
          fi
          echo "Confirmed: no dynamic dependencies (NEEDED entries: none)"

          if [ "${{ matrix.cross }}" = "true" ]; then
            echo "Skipping execution check: no native runner for ${{ matrix.target }}"
          else
            echo "== --version =="
            "$BIN" --version
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == windows* ]]; then
            SRC="target/release/tsi.exe"
          elif [ -n "${{ matrix.target }}" ]; then
            SRC="target/${{ matrix.target }}/release/tsi"
          else
            SRC="target/release/tsi"
          fi
          cp "$SRC" tsi-${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: tsi-${{ matrix.platform }}
          path: tsi-${{ matrix.platform }}

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: tsi-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: tsi-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0). Must already exist.'
        required: true
        type: string

# Documentation is deployed by docs.yml from main, not from here: the
# github-pages environment rejects deployments from tag refs.
permissions:
  contents: write

jobs:
  # Every platform's binary comes from the shared matrix, the same one that
  # runs on each push, so what gets released is what CI already built.
  build:
    name: Build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: tsi-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: tsi-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

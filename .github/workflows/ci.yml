name: CI

# The single pipeline for every code change, in stages:
#   1. lint   -- cheap checks that fail in seconds (fmt, clippy, actionlint, shellcheck)
#   2. build  -- every release platform, with tests and smoke tests
#                (build-binaries.yml, the same matrix the release ships)
#   3. e2e    -- real installs in distro containers, using the stage-2 binaries
#                (e2e.yml)
#   4. release -- main only, once everything above is green: tag and publish
#                the very binaries that were just built and tested.
# Every push to main releases the next MINOR version (v0.2.2 -> v0.3.0). A MAJOR
# release is manual: Actions -> CI -> Run workflow on main with bump = major.
# Documentation has its own workflow (docs.yml).
on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'tests/**'
      - '*.sh'
      - 'docker/**'
      - 'tsi-packages'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'tests/**'
      - '*.sh'
      - 'docker/**'
      - 'tsi-packages'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release a new version from main. "major" bumps the major version; "none" only runs CI.'
        type: choice
        options: [ none, major ]
        default: none

permissions:
  contents: read

# A newer push to a PR supersedes the run in flight. Runs on main queue instead:
# cancelling one halfway through a release would leave a tag without assets.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-lint:
    name: Clippy + fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Clippy runs per OS because cfg(windows)/cfg(target_os) code is only
      # compiled, and so only linted, on its own platform.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  # A workflow that only parses as YAML can still be broken: an unknown context,
  # a typo'd `needs`, a job referencing an output that does not exist. actionlint
  # catches those before a push, and shellchecks the `run:` blocks too.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Lint workflows
        # -S warning matches the severity the shell job uses, so the two agree
        # on what counts as a problem.
        env:
          SHELLCHECK_OPTS: -S warning
        run: ./actionlint -color

  # The bootstrap script is how most users first get TSI, so a syntax or quoting
  # slip there is a broken install, not a broken build.
  shell:
    name: Shellcheck (bootstrap, docker scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - name: Check shell scripts
        run: shellcheck -S warning tsi-bootstrap.sh docker/*.sh

      - name: Verify bootstrap script parses under sh and bash
        run: |
          sh -n tsi-bootstrap.sh
          bash -n tsi-bootstrap.sh

      - name: Bootstrap --help works without network or toolchain
        run: sh tsi-bootstrap.sh --help

  # Decides the version this run would release, or nothing (empty) when it is
  # not a release run. Computed up front because the version is baked into the
  # binaries (`tsi --version`, `tsi self-update`), so it must exist before the
  # build. Cargo.toml in the repo is not the source of truth: the latest git tag
  # is, and the build overrides Cargo.toml with the next version.
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0
      - id: next
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          bump=""
          if [ "$REF" = refs/heads/main ]; then
            if [ "$EVENT" = push ]; then bump=minor; fi
            if [ "$EVENT" = workflow_dispatch ] && [ "$BUMP" = major ]; then bump=major; fi
          fi
          if [ -z "$bump" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Not a release run."
            exit 0
          fi
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest#v}
          if [ -z "$latest" ]; then
            latest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          IFS=. read -r major minor _ <<< "$latest"
          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
          esac
          echo "Latest is ${latest}; releasing ${next} (${bump})."
          echo "version=$next" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [rust-lint, actionlint, shell, version]
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # A failed leg elsewhere in the build (say, Windows) must not skip every
  # container test; a missing artifact still fails its own leg. Only skip when
  # build itself was skipped because a lint stage failed.
  e2e:
    name: E2E
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    uses: ./.github/workflows/e2e.yml

  release:
    name: Release ${{ needs.version.outputs.version }}
    needs: [version, build, e2e]
    if: ${{ needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: tsi-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: tsi-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Docker E2E Tests

# Called by ci.yml after build-binaries.yml has produced the tsi-<platform>
# artifacts in the same run; the container jobs consume those instead of
# rebuilding.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Real end-to-end install: only a C compiler + make are installed inside
  # each bare distro container, then tsi builds a real package (bzip2) from
  # source. This is the core reliability gap the old test-install.sh never
  # covered (it built tsi with cargo but never ran `tsi install`).
  #
  # x86_64 and aarch64 run natively on their own runners across four distros.
  # The other architectures have no hosted runner, so their containers run
  # under qemu-user emulation (emulated: true) on images each of those
  # distros actually publishes for that architecture. They are slow, so they
  # cover alpine (musl) and, where published, debian (glibc).
  container-tests:
    name: E2E install (${{ matrix.distro }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, runner: ubuntu-latest, docker: linux/amd64, emulated: false, distro: alpine, image: "alpine:latest"}
          - {platform: linux-x86_64, runner: ubuntu-latest, docker: linux/amd64, emulated: false, distro: debian, image: "debian:stable-slim"}
          - {platform: linux-x86_64, runner: ubuntu-latest, docker: linux/amd64, emulated: false, distro: ubuntu, image: "ubuntu:24.04"}
          - {platform: linux-x86_64, runner: ubuntu-latest, docker: linux/amd64, emulated: false, distro: fedora, image: "fedora:latest"}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm, docker: linux/arm64, emulated: false, distro: alpine, image: "alpine:latest"}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm, docker: linux/arm64, emulated: false, distro: debian, image: "debian:stable-slim"}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm, docker: linux/arm64, emulated: false, distro: ubuntu, image: "ubuntu:24.04"}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm, docker: linux/arm64, emulated: false, distro: fedora, image: "fedora:latest"}
          - {platform: linux-i686, runner: ubuntu-latest, docker: linux/386, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-i686, runner: ubuntu-latest, docker: linux/386, emulated: true, distro: debian, image: "debian:stable-slim"}
          - {platform: linux-armv7, runner: ubuntu-latest, docker: linux/arm/v7, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-armv7, runner: ubuntu-latest, docker: linux/arm/v7, emulated: true, distro: debian, image: "debian:stable-slim"}
          # Debian has no armv6 image (armel targets v5), so alpine only.
          - {platform: linux-armv6, runner: ubuntu-latest, docker: linux/arm/v6, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-riscv64, runner: ubuntu-latest, docker: linux/riscv64, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-riscv64, runner: ubuntu-latest, docker: linux/riscv64, emulated: true, distro: debian, image: "debian:stable-slim"}
          - {platform: linux-ppc64le, runner: ubuntu-latest, docker: linux/ppc64le, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-ppc64le, runner: ubuntu-latest, docker: linux/ppc64le, emulated: true, distro: debian, image: "debian:stable-slim"}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive

      - name: Download static binary
        uses: actions/download-artifact@v7.0.0
        with:
          name: tsi-${{ matrix.platform }}
          path: artifacts

      - name: Make binary executable
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mv "artifacts/tsi-$PLATFORM" artifacts/tsi
          chmod +x artifacts/tsi

      - name: Set up QEMU
        if: ${{ matrix.emulated }}
        uses: docker/setup-qemu-action@v3

      - name: Run e2e install test in ${{ matrix.image }} (${{ matrix.docker }})
        env:
          DOCKER_PLATFORM: ${{ matrix.docker }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            -e TSI_BIN=/work/artifacts/tsi \
            -v "$PWD":/work:ro \
            "$IMAGE" \
            sh /work/docker/e2e-test.sh

  # Proves the static binary itself has zero runtime dependencies: no
  # package manager step runs at all here. tsi --version/--help/doctor must
  # work out of the box, and `tsi install <pkg>` must fail gracefully
  # (non-zero exit, no Rust panic) when there's no toolchain or registry.
  # Cheap even under emulation, so it covers every Linux architecture.
  no-tools-test:
    name: Zero-dependency test (${{ matrix.distro }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, runner: ubuntu-latest, docker: linux/amd64, emulated: false, distro: alpine, image: "alpine:latest"}
          - {platform: linux-x86_64, runner: ubuntu-latest, docker: linux/amd64, emulated: false, distro: debian, image: "debian:stable-slim"}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm, docker: linux/arm64, emulated: false, distro: alpine, image: "alpine:latest"}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm, docker: linux/arm64, emulated: false, distro: debian, image: "debian:stable-slim"}
          - {platform: linux-i686, runner: ubuntu-latest, docker: linux/386, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-i686, runner: ubuntu-latest, docker: linux/386, emulated: true, distro: debian, image: "debian:stable-slim"}
          - {platform: linux-armv7, runner: ubuntu-latest, docker: linux/arm/v7, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-armv7, runner: ubuntu-latest, docker: linux/arm/v7, emulated: true, distro: debian, image: "debian:stable-slim"}
          - {platform: linux-armv6, runner: ubuntu-latest, docker: linux/arm/v6, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-riscv64, runner: ubuntu-latest, docker: linux/riscv64, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-riscv64, runner: ubuntu-latest, docker: linux/riscv64, emulated: true, distro: debian, image: "debian:stable-slim"}
          - {platform: linux-ppc64le, runner: ubuntu-latest, docker: linux/ppc64le, emulated: true, distro: alpine, image: "alpine:latest"}
          - {platform: linux-ppc64le, runner: ubuntu-latest, docker: linux/ppc64le, emulated: true, distro: debian, image: "debian:stable-slim"}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Download static binary
        uses: actions/download-artifact@v7.0.0
        with:
          name: tsi-${{ matrix.platform }}
          path: artifacts

      - name: Make binary executable
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mv "artifacts/tsi-$PLATFORM" artifacts/tsi
          chmod +x artifacts/tsi

      - name: Set up QEMU
        if: ${{ matrix.emulated }}
        uses: docker/setup-qemu-action@v3

      - name: Run zero-dependency test in ${{ matrix.image }} (${{ matrix.docker }})
        env:
          DOCKER_PLATFORM: ${{ matrix.docker }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            -v "$PWD/artifacts":/artifacts:ro \
            -v "$PWD/docker":/scripts:ro \
            "$IMAGE" \
            sh /scripts/no-tools-test.sh /artifacts/tsi
